framework:
  messenger:
    # A message that failed every retry lands here instead of being lost: messenger:failed:show / :retry.
    failure_transport: failed
    default_bus: messenger.bus.default
    buses:
      # Emails handed to the worker.
      messenger.bus.default: ~
      # Write use cases (App\Shared\Application\Command\CommandBus): commands are routed to no transport, so the
      # handler runs inside dispatch(), in one transaction — flushed and committed when it returns, rolled back
      # when it throws. Every CommandHandler and EventHandler is registered here (services.yaml, _instanceof).
      command.bus:
        middleware:
          - doctrine_transaction
    transports:
      # Emails (App\Shared\Infrastructure\Mail\QueuedMailer). A table in the app's own database
      # (messenger_messages, the one table the restructure adds): a cPanel account has no Redis or RabbitMQ. Drained
      # by "messenger:consume mail": the worker service in docker compose, a cron line on the server
      # (deploy/cpanel-update.sh). The legacy Twig app still sends its email synchronously, as before.
      mail:
        dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
        options:
          queue_name: mail
          redeliver_timeout: 300
        retry_strategy:
          max_retries: 3
          delay: 60000
          multiplier: 5
      failed: 'doctrine://default?queue_name=failed&auto_setup=0'

when@test:
  framework:
    messenger:
      transports:
        # Delivered on the spot in tests, so every test that asserts an email still sees it at once.
        mail: 'sync://'
        failed: 'in-memory://'
