# The old Twig pages' addresses, redirected (301) to the React app's: a bookmark or an old link keeps working. Loaded
# before routes.yaml, so these win over the legacy controllers and the SPA's catch-all. Each UI item adds the rows of
# the screens it replaces; item 12 reviews the file when the Twig app is gone.
#
# The route names are the legacy ones (the Twig sidebar in base.html.twig still builds its links with path()).

# Item 1 (identity): the Users screens.
user_index:
  path: /admin/user/
  controller: Symfony\Bundle\FrameworkBundle\Controller\RedirectController::urlRedirectAction
  defaults: {path: /admin/users, permanent: true}
  methods: [GET]

user_user_new:
  path: /admin/user/new
  controller: Symfony\Bundle\FrameworkBundle\Controller\RedirectController::urlRedirectAction
  defaults: {path: /admin/users/new, permanent: true}
  methods: [GET]

# The edit address carried the user's id in a form a static redirect cannot rewrite: it lands on the list.
user_user_edit:
  path: /admin/user/edit/{user}
  controller: Symfony\Bundle\FrameworkBundle\Controller\RedirectController::urlRedirectAction
  defaults: {path: /admin/users, permanent: true}
  methods: [GET]

# Item 7 (stock-ui): upload, barcode reader, incoming products and warehouses.
product_product_upload:
  path: /admin/product/upload
  controller: Symfony\Bundle\FrameworkBundle\Controller\RedirectController::urlRedirectAction
  defaults: {path: /admin/products/upload, permanent: true}
  methods: [GET]

product_bar_code:
  path: /admin/product/update/bar-code
  controller: Symfony\Bundle\FrameworkBundle\Controller\RedirectController::urlRedirectAction
  defaults: {path: /admin/products/barcode, permanent: true}
  methods: [GET]

product_incoming:
  path: /admin/product/incoming
  controller: Symfony\Bundle\FrameworkBundle\Controller\RedirectController::urlRedirectAction
  defaults: {path: /admin/products/incoming, permanent: true}
  methods: [GET]

warehouse_warehouse_index:
  path: /admin/warehouse/
  controller: Symfony\Bundle\FrameworkBundle\Controller\RedirectController::urlRedirectAction
  defaults: {path: /admin/warehouses, permanent: true}
  methods: [GET]

# The edit address carried the warehouse's id; the rename is a modal now, so it lands on the list.
warehouse_warehouse_edit:
  path: /admin/warehouse/edit/{warehouse}
  controller: Symfony\Bundle\FrameworkBundle\Controller\RedirectController::urlRedirectAction
  defaults: {path: /admin/warehouses, permanent: true}

# Item 6 (products-ui): the product list and the product form.
product_product_index:
  path: /admin/product/
  controller: Symfony\Bundle\FrameworkBundle\Controller\RedirectController::urlRedirectAction
  defaults: {path: /admin/products, permanent: true}
  methods: [GET]

product_new:
  path: /admin/product/new
  controller: Symfony\Bundle\FrameworkBundle\Controller\RedirectController::urlRedirectAction
  defaults: {path: /admin/products/new, permanent: true}
  methods: [GET]

# The edit address keeps the product's uuid: redirectAction passes the {uuid} attribute on to spa_product_edit.
product_update:
  path: /admin/product/edit/{uuid}
  controller: Symfony\Bundle\FrameworkBundle\Controller\RedirectController::redirectAction
  defaults: {route: spa_product_edit, permanent: true}
  methods: [GET]

# The React app's product form, named so the redirect above can build it (the SPA's catch-all would serve it too).
spa_product_edit:
  path: /admin/products/{uuid}/edit
  controller: App\Shared\UI\Http\Spa\SpaController

# Item 8 (customers-ui): the Customers screens.
customer_index:
  path: /admin/customer/
  controller: Symfony\Bundle\FrameworkBundle\Controller\RedirectController::urlRedirectAction
  defaults: {path: /admin/customers, permanent: true}
  methods: [GET]

customer_new:
  path: /admin/customer/new
  controller: Symfony\Bundle\FrameworkBundle\Controller\RedirectController::urlRedirectAction
  defaults: {path: /admin/customers/new, permanent: true}
  methods: [GET]

# The edit address carried the customer's id in a form a static redirect cannot rewrite: it lands on the list.
customer_edit:
  path: /admin/customer/edit/{customer}
  controller: Symfony\Bundle\FrameworkBundle\Controller\RedirectController::urlRedirectAction
  defaults: {path: /admin/customers, permanent: true}
  methods: [GET]

# Item 10 (order-forms-ui): the order form (new, edit) and the getting-ready screen. The edit and getting-ready
# addresses keep the order's id: redirectAction passes the {order} attribute on to the React routes named below.
order_new:
  path: /admin/order/new
  controller: Symfony\Bundle\FrameworkBundle\Controller\RedirectController::urlRedirectAction
  defaults: {path: /admin/orders/new, permanent: true}
  methods: [GET]

order_edit:
  path: /admin/order/edit/{order}
  controller: Symfony\Bundle\FrameworkBundle\Controller\RedirectController::redirectAction
  defaults: {route: spa_order_edit, permanent: true}
  requirements: {order: '\d+'}
  methods: [GET]

order_getting_ready:
  path: /admin/order/partial/getting-ready/{order}
  controller: Symfony\Bundle\FrameworkBundle\Controller\RedirectController::redirectAction
  defaults: {route: spa_order_getting_ready, permanent: true}
  requirements: {order: '\d+'}
  methods: [GET]

# The React app's order form and getting-ready screen, named so the redirects above can build them (the SPA's
# catch-all would serve them too).
spa_order_edit:
  path: /admin/orders/{order}/edit
  controller: App\Shared\UI\Http\Spa\SpaController

spa_order_getting_ready:
  path: /admin/orders/{order}/getting-ready
  controller: App\Shared\UI\Http\Spa\SpaController
