# Bounded contexts: a context uses another only through its public face — its Application layer (commands, queries,
# ports, read DTOs) and its domain events. Its Domain model, Infrastructure and UI are its own business.
#
# Each context is two layers here: <Context> (Domain except Domain\Event and Domain\Model, Infrastructure, UI) and
# <Context>Api (Application and Domain\Event). Shared is the shared kernel: everyone may use it, it uses nobody.
#
# DomainModels: every context's Domain\Model. The production schema has foreign keys between contexts (an order's
# customer, warehouse and products; an invoice's customer and products; a log's or comment's user), and the
# database must not change (docs/pdr/prd-restructure.md, "Database invariance"), so those Doctrine associations stay
# mapped and the models name each other. That is the one cross-context reference allowed outside the Api layers.
#
# To add a context, add both layers and give every rule list its <Context>Api.
deptrac:
  paths:
    - ./src
  exclude_files:
    - '#.*/src/DataFixtures/.*#'

  layers:
    - name: Shared
      collectors:
        - {type: classNameRegex, value: '#^App\\Shared\\#'}
    - name: DomainModels
      collectors:
        - {
            type: classNameRegex,
            value: '#^App\\(?!Shared\\)[A-Za-z]+\\Domain\\Model\\#',
          }

    - name: Identity
      collectors:
        - {
            type: classNameRegex,
            value: '#^App\\Identity\\(Domain\\(?!Event\\|Model\\)|Infrastructure\\|UI\\)#',
          }
    - name: IdentityApi
      collectors:
        - {
            type: classNameRegex,
            value: '#^App\\Identity\\(Application|Domain\\Event)\\#',
          }

    - name: Inventory
      collectors:
        - {
            type: classNameRegex,
            value: '#^App\\Inventory\\(Domain\\(?!Event\\|Model\\)|Infrastructure\\|UI\\(?!Http\\(Input|Output)\\))#',
          }
    # Inventory's request and response DTOs: an order or invoice endpoint takes and answers the same shapes (an address,
    # a customer, a warehouse, a stock row) instead of copies of them.
    - name: InventoryHttp
      collectors:
        - {
            type: classNameRegex,
            value: '#^App\\Inventory\\UI\\Http\\(Input|Output)\\#',
          }
    - name: InventoryApi
      collectors:
        - {
            type: classNameRegex,
            value: '#^App\\Inventory\\(Application|Domain\\Event)\\#',
          }

    - name: Customers
      collectors:
        - {
            type: classNameRegex,
            value: '#^App\\Customers\\(Domain\\(?!Event\\|Model\\)|Infrastructure\\|UI\\(?!Http\\(Input|Output)\\))#',
          }
    # Customers's request and response DTOs: an order or invoice endpoint takes and answers the same shapes (an address,
    # a customer, a warehouse, a stock row) instead of copies of them.
    - name: CustomersHttp
      collectors:
        - {
            type: classNameRegex,
            value: '#^App\\Customers\\UI\\Http\\(Input|Output)\\#',
          }
    - name: CustomersApi
      collectors:
        - {
            type: classNameRegex,
            value: '#^App\\Customers\\(Application|Domain\\Event)\\#',
          }

    - name: Ordering
      collectors:
        - {
            type: classNameRegex,
            value: '#^App\\Ordering\\(Domain\\(?!Event\\|Model\\)|Infrastructure\\|UI\\)#',
          }
    - name: OrderingApi
      collectors:
        - {
            type: classNameRegex,
            value: '#^App\\Ordering\\(Application|Domain\\Event)\\#',
          }

    - name: Invoicing
      collectors:
        - {
            type: classNameRegex,
            value: '#^App\\Invoicing\\(Domain\\(?!Event\\|Model\\)|Infrastructure\\|UI\\)#',
          }
    - name: InvoicingApi
      collectors:
        - {
            type: classNameRegex,
            value: '#^App\\Invoicing\\(Application|Domain\\Event)\\#',
          }

    # Added by shops-settings: app settings, quick phrases, the secrets' encryption (docs/pdr/prd-shops-settings.md).
    - name: Settings
      collectors:
        - {
            type: classNameRegex,
            value: '#^App\\Settings\\(Domain\\(?!Event\\|Model\\)|Infrastructure\\|UI\\)#',
          }
    - name: SettingsApi
      collectors:
        - {
            type: classNameRegex,
            value: '#^App\\Settings\\(Application|Domain\\Event)\\#',
          }

    - name: Audit
      collectors:
        - {
            type: classNameRegex,
            value: '#^App\\Audit\\(Domain\\(?!Event\\|Model\\)|Infrastructure\\|UI\\)#',
          }
    - name: AuditApi
      collectors:
        - {
            type: classNameRegex,
            value: '#^App\\Audit\\(Application|Domain\\Event)\\#',
          }

  ruleset:
    Shared: ~
    DomainModels: [DomainModels, Shared]
    Identity: [Shared, IdentityApi, DomainModels]
    IdentityApi: [Shared, Identity, DomainModels]
    Inventory: [Shared, InventoryApi, InventoryHttp, DomainModels]
    InventoryHttp: [Shared, Inventory, InventoryApi, DomainModels]
    InventoryApi: [Shared, Inventory, DomainModels]
    Customers: [Shared, CustomersApi, CustomersHttp, DomainModels]
    CustomersHttp: [Shared, Customers, CustomersApi, DomainModels]
    CustomersApi: [Shared, Customers, DomainModels]
    # An order's customer is found or created through Customers (CustomerRegistry); its stock comes from Inventory; the
    # order email's sender, printer and cc, and the legacy webhook's switch, from Settings.
    Ordering:
      [
        Shared,
        OrderingApi,
        DomainModels,
        CustomersApi,
        InventoryApi,
        CustomersHttp,
        InventoryHttp,
        SettingsApi,
      ]
    OrderingApi:
      [Shared, Ordering, DomainModels, CustomersApi, InventoryApi, SettingsApi]
    # An invoice's customer comes from Customers; its lines may name an Inventory product.
    Invoicing:
      [
        Shared,
        InvoicingApi,
        DomainModels,
        CustomersApi,
        InventoryApi,
        CustomersHttp,
        InventoryHttp,
      ]
    InvoicingApi: [Shared, Invoicing, DomainModels, CustomersApi, InventoryApi]
    Settings: [Shared, SettingsApi, DomainModels]
    SettingsApi: [Shared, Settings, DomainModels]
    # The activity log implements Shared's ActivityLog port and records the signed-in user.
    Audit: [Shared, AuditApi, DomainModels]
    AuditApi: [Shared, Audit, DomainModels]
