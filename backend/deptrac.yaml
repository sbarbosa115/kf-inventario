# Layers: dependencies only point inward — UI → Application → Domain, Infrastructure → Application | Domain.
#
# Every bounded context (and Shared) has the same four folders, src/<Context>/{Domain,Application,Infrastructure,UI},
# so one regex per layer covers them all. Which contexts may talk to each other is deptrac.contexts.yaml.
#
#   docker compose exec php composer deptrac
deptrac:
  paths:
    - ./src
  exclude_files:
    # Dev and smoke seed data, not part of the application.
    - '#.*/src/DataFixtures/.*#'

  layers:
    - name: Domain
      collectors:
        - {type: classNameRegex, value: '#^App\\[A-Za-z]+\\Domain\\#'}

    - name: Application
      collectors:
        - {type: classNameRegex, value: '#^App\\[A-Za-z]+\\Application\\#'}

    - name: Infrastructure
      collectors:
        - {type: classNameRegex, value: '#^App\\[A-Za-z]+\\Infrastructure\\#'}

    - name: UI
      collectors:
        - {type: classNameRegex, value: '#^App\\[A-Za-z]+\\UI\\#'}

    - name: Kernel
      collectors:
        - {type: classNameRegex, value: '#^App\\Kernel$#'}

    # The legacy Twig app (src/Controller, Services, Form…), kept working while the restructure replaces it and
    # removed by item 12 (docs/pdr/prd-restructure.md). It may use anything; nothing new may use it.
    - name: Legacy
      collectors:
        - {
            type: classNameRegex,
            value: '#^App\\(Command|Constraints|Controller|DataProviders|EventListener|Form|Model|Repository|Security|Services|Validator)\\#',
          }

    # The only outside code a domain model may name: its Doctrine and Gedmo mapping attributes, collections for its
    # children, the DBAL type names and UUIDs for its identity, the Security user contract the User model signs in
    # with, and the validation attributes the moved entities still carry (the legacy forms read them; the Input DTOs
    # take them over). Never the EntityManager or a query builder.
    - name: DomainVendor
      collectors:
        - {
            type: classNameRegex,
            value: '#^(Doctrine\\ORM\\Mapping\\|Doctrine\\Common\\Collections\\|Doctrine\\DBAL\\Types\\Types$|Gedmo\\Mapping\\|Ramsey\\Uuid\\|Symfony\\Component\\Uid\\|Symfony\\Component\\Security\\Core\\User\\|Symfony\\Component\\Validator\\Constraints\\|Symfony\\Bridge\\Doctrine\\Validator\\Constraints\\UniqueEntity$)#',
          }

    # PHP-FIG interfaces (a logger): standards, not a framework, so a use case may log what it swallows.
    - name: Standards
      collectors:
        - {type: classNameRegex, value: '#^Psr\\(Log|Clock)\\#'}

    # Every other namespaced class outside App (Symfony, Doctrine ORM, Twig, Dompdf…). PHP's own classes have no
    # namespace, so \DateTimeImmutable and friends stay free for everyone.
    - name: Vendor
      collectors:
        - {
            type: classNameRegex,
            value: '#^(?!App\\|Doctrine\\ORM\\Mapping\\|Doctrine\\Common\\Collections\\|Doctrine\\DBAL\\Types\\Types$|Gedmo\\Mapping\\|Ramsey\\Uuid\\|Symfony\\Component\\Uid\\|Symfony\\Component\\Security\\Core\\User\\|Symfony\\Component\\Validator\\Constraints\\|Symfony\\Bridge\\Doctrine\\Validator\\Constraints\\UniqueEntity$|Psr\\(Log|Clock)\\)[A-Za-z0-9_]+\\#',
          }

  ruleset:
    Domain:
      - DomainVendor
    Application:
      - Domain
      - DomainVendor
      - Standards
    Infrastructure:
      - Domain
      - Application
      - DomainVendor
      - Standards
      - Vendor
    # The Symfony kernel itself.
    Kernel:
      - Vendor
    UI:
      - Application
      - Domain
      - DomainVendor
      - Standards
      - Vendor
    Legacy:
      - Domain
      - Application
      - Infrastructure
      - UI
      - DomainVendor
      - Standards
      - Vendor
