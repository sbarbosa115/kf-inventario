# Host ports come from the environment or a root .env (gitignored, see .env.example), with the usual defaults, so a
# second checkout (a git worktree for a feature) can run its own stack next to this one: compose names containers and
# volumes after the folder.
#
# Every service has a CPU ceiling (`cpus`, each overridable from the environment or the root .env): several worktree
# stacks share one machine, and without a ceiling one stack's UI rebuild or smoke run takes every core.
x-php: &php
  build:
    context: ./docker/php
    args:
      UID: ${UID:-1000}
      GID: ${GID:-1000}
  volumes:
    - ./backend:/app
  environment:
    # Links in emails point at this stack's own port.
    DEFAULT_URI: http://localhost:${HTTP_PORT:-8080}
  cpus: ${PHP_CPUS:-2}
  depends_on:
    database:
      condition: service_healthy

services:
  php:
    <<: *php

  # Sends the order emails and writes back to the shops: drains the Messenger "mail" and "shops" queues (a table in the
  # database), as the cron line does on cPanel (deploy/cpanel-update.sh). Run "messenger:stop-workers" after changing
  # PHP code; it restarts itself.
  worker:
    <<: *php
    command: ["php", "bin/console", "messenger:consume", "mail", "shops", "--time-limit=3600", "--memory-limit=256M", "-v"]
    restart: unless-stopped
    cpus: ${WORKER_CPUS:-1}

  nginx:
    image: nginx:1.27-alpine
    cpus: ${NGINX_CPUS:-1}
    ports:
      - "${HTTP_PORT:-8080}:80"
    volumes:
      - ./backend/public:/app/public:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - php

  # Production runs MySQL 8.x (cPanel). The schema baseline (docs/db/) was recorded on this image; utf8 +
  # utf8_unicode_ci are the server defaults the existing tables were created with.
  database:
    image: ${DB_IMAGE:-mysql:8.0}
    command: --character-set-server=utf8 --collation-server=utf8_unicode_ci
    cpus: ${DB_CPUS:-2}
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: app
      MYSQL_USER: app
      MYSQL_PASSWORD: app
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - db_data:/var/lib/mysql
      # Lets the app user create app_test for the test suite.
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Builds the React UI (backend/assets → backend/public/build) and rebuilds on change (docker/node/start.sh). A
  # stack that only runs the smoke suite can set UI_WATCH=0 in its root .env.
  node:
    image: node:22-alpine
    working_dir: /app
    user: "${UID:-1000}:${GID:-1000}"
    init: true
    cpus: ${NODE_CPUS:-2}
    volumes:
      - ./backend:/app
      - ./docker/node/start.sh:/usr/local/bin/start-ui:ro
    environment:
      UI_WATCH: ${UI_WATCH:-1}
    command: ["sh", "/usr/local/bin/start-ui"]

  # End-to-end tests (backend/e2e, Playwright). Not started with the stack: `docker compose --profile e2e run --rm e2e`.
  e2e:
    image: mcr.microsoft.com/playwright:v1.63.0-noble
    profiles: ["e2e"]
    cpus: ${E2E_CPUS:-4}
    working_dir: /app
    user: "${UID:-1000}:${GID:-1000}"
    ipc: host
    volumes:
      - ./backend:/app
    environment:
      HOME: /tmp
      E2E_BASE_URL: http://nginx
      MAILPIT_URL: http://mailpit:8025
    depends_on:
      - nginx
      - mailpit
    command: npx playwright test

  # Catches all outgoing email locally. Web inbox: http://localhost:8025 (or MAILPIT_PORT)
  mailpit:
    image: axllent/mailpit:v1.21
    cpus: ${MAILPIT_CPUS:-0.5}
    ports:
      - "${MAILPIT_PORT:-8025}:8025"

volumes:
  db_data:
