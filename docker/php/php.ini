memory_limit = 512M
; The product spreadsheet upload (Inventory) reads xls/xlsx files; keep nginx client_max_body_size in sync.
upload_max_filesize = 12M
post_max_size = 12M
max_execution_time = 120
; Production (cPanel) runs the app in Bogota time: the dates the app writes depend on it.
date.timezone = America/Bogota
